[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aviora"
version = "0.2.0"
description = "AI Search Framework powered by Tavily — build AI agents with real-time web search"
readme = "README.md"
requires-python = ">=3.10"

authors = [
    {name = "Syed Faisal"}
]

license = "MIT"

dependencies = [
    "tavily-python>=0.7.0",
    "typing_extensions>=4.0"
]

keywords = [
    "ai",
    "agents",
    "search",
    "tavily",
    "llm",
    "rag",
    "web-search",
    "openai",
    "langchain",
    "autonomous-agents"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24"
]

[project.urls]
Homepage = "https://github.com/Far-1975/aviora"
"Bug Tracker" = "https://github.com/Far-1975/aviora/issues"
Documentation = "https://github.com/Far-1975/aviora#readme"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
